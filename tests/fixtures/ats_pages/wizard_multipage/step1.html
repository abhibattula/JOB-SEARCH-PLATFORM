<!DOCTYPE html><html><head><meta charset="utf-8"><title>Application — step 1 of 3</title></head>
<body>
<h1>Apply — Contact information (step 1 of 3)</h1>
<!-- Escort fixture, page 1. Real navigation between steps: Continue is a
     type=submit that GETs the next page — exactly the shape the old
     denylist could never click and the advancer now may (kind next), but
     ONLY after every visible required field is decided. -->
<form id="form" method="get" action="step2.html">
  <label>First Name<input name="job_application[first_name]" type="text" required></label>
  <label>Last Name<input name="job_application[last_name]" type="text" required></label>
  <label>Email<input name="job_application[email]" type="email" required></label>
  <label>Phone<input name="job_application[phone]" type="tel" required></label>
  <button type="submit" id="continue1">Continue</button>
</form>
<script src="/_mirror.js"></script>
<script>
  document.getElementById('continue1').addEventListener('click', function () {
    try {
      var payload = JSON.stringify({name:'__step1_continue', value:'yes'});
      navigator.sendBeacon('/echo', new Blob([payload], {type:'application/json'}));
    } catch (e) { }
  });
</script>
</body></html>
