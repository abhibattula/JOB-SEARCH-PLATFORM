<!DOCTYPE html><html><head><meta charset="utf-8"><title>Placeholder select application</title></head>
<body>
<h1>Apply — selects resting on placeholders</h1>
<!-- R9 fixture: both choice controls DISPLAY a value that means "nothing
     chosen yet". Today they read back as real values → skipped_existing
     forever. The fix must treat them as unanswered and fill them. -->
<form id="form">
  <label>First Name<input name="ps_first" type="text"></label>
  <label>Email<input name="ps_email" type="email"></label>

  <!-- the classic: value="0" placeholder option -->
  <label>Are you authorized to work in the United States?
    <select name="ps_auth">
      <option value="0">Select…</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>
  </label>

  <!-- value="-1" variant with please-select text -->
  <label>Will you require sponsorship?
    <select name="ps_sponsor">
      <option value="-1">-- Please Select --</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>
  </label>

  <!-- a legitimately prefilled select: MUST stay untouched (skipped_existing) -->
  <label>Country
    <select name="ps_country">
      <option value="us" selected>United States</option>
      <option value="ca">Canada</option>
    </select>
  </label>
</form>
<script src="/_mirror.js"></script>
</body></html>
