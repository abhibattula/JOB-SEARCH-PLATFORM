<!DOCTYPE html><html><head><meta charset="utf-8"><title>Never-ending wizard</title></head>
<body>
<h1>Apply — a wizard that never ends</h1>
<!-- Cap fixture (FR-027): every Continue renders ANOTHER step with fresh
     field names (new fieldset hash), so an uncapped advancer would loop
     forever. The escort must stop at advance #12 and pause (paused_cap).
     The step counter is exposed for the assertion. -->
<div id="step-host"></div>
<script src="/_mirror.js"></script>
<script>
  var n = 0;
  var host = document.getElementById('step-host');
  function renderStep() {
    n += 1;
    document.documentElement.setAttribute('data-loop-step', String(n));
    host.innerHTML =
      '<h2>Step ' + n + '</h2>' +
      '<form id="f' + n + '">' +
      '<label>Question ' + n +
      '<input name="loop_q' + n + '" type="text" required></label>' +
      '<button type="button" id="loop-next">Continue</button></form>';
    document.getElementById('loop-next').addEventListener('click', function () {
      try {
        var payload = JSON.stringify({name:'__loop_advance', value:String(n)});
        navigator.sendBeacon('/echo', new Blob([payload], {type:'application/json'}));
      } catch (e) { }
      renderStep();
    });
  }
  renderStep();
</script>
</body></html>
