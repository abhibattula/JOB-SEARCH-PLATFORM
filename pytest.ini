[pytest]
# 009: the real-browser fixture suite (tests/integration, launches headless
# Edge/Chrome against local fixture pages) is opt-in — the default run
# stays fast and browser-free. Run it with:  pytest -m browser
markers =
    browser: real-browser integration tests against bundled fixture pages
    slow: real-model gates (minutes of local inference); run with -m slow
addopts = -m "not browser and not slow"
# 014: the noisy warnings were dominated by FastAPI's on_event deprecation
# (migrated to lifespan) — now gone. The remaining recurring one is a THIRD-PARTY
# deprecation from Starlette's TestClient using httpx (httpx2 is not yet a real
# release), which we cannot fix from here; silence just that one so the run is
# quiet and a real DeprecationWarning from our own code stands out.
filterwarnings =
    ignore:Using .httpx. with .starlette.testclient. is deprecated
